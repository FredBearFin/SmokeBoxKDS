[package]
name = "smokebox-server"
version = "0.1.0"
edition = "2021"
description = "SmokeBox hosted server: kitchen accounts, devices, live sync and support, running the same kitchen engine as the tablets"
license = "UNLICENSED"
publish = false

[dependencies]
smokebox-engine = { path = "../engine" }
rquickjs = { version = "0.14", features = ["loader"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
